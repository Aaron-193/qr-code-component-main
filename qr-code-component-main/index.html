<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./styles/index.css">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main role="main" class="container">
  <section class="content-div">
    <header class="banner">
      <h1>QR Code Component</h1>
    </header>
    <figure>
    <img src="./images/image-qr-code.png" class="qr-code-img" alt="scannable qr-code to visit Frontend Mentors website"/>
    </figure>
    <h2 class="bold-txt">Improve your front-end skills by building projects</h2>
    <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </section>
  <section role="contentinfo" class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_self" rel="noopener noreferrer" aria-label="Example site opens in a new tab">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </section>
  </main>
</body>
</html>
